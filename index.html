<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Táctica · Gestión Financiera</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070A10; --panel:#0F1622; --panel2:#0C111B; --raise:#16202F;
    --border:#1B2636; --border2:#27374E;
    --text:#EAEFF6; --muted:#8492A6; --faint:#566074;
    --accent:#3FE0C5; --accent2:#5B8DEF; --dim:rgba(63,224,197,.10);
    --rec:#37D39A; --spo:#5B8DEF; --neg:#FB6E6E; --warn:#F2C261;
    --grid:rgba(255,255,255,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(820px 360px at 82% -8%,rgba(91,141,239,.10),transparent 60%),radial-gradient(760px 340px at 8% -6%,rgba(63,224,197,.07),transparent 55%);}
  .num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .wrap{max-width:1080px;margin:0 auto;padding:0 24px}
  /* top bar */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;max-width:1080px;margin:0 auto;flex-wrap:wrap}
  .logo{display:flex;align-items:center;gap:11px;cursor:pointer}
  .mark{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-family:"Sora";font-weight:700;color:#06121A;font-size:18px;box-shadow:0 0 22px rgba(63,224,197,.3)}
  .logo .name{font-family:"Sora";font-weight:600;font-size:17px;letter-spacing:.12em}
  .logo .name small{display:block;font-size:9.5px;letter-spacing:.22em;color:var(--muted);font-weight:400;margin-top:1px}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:6px 10px;min-width:74px}
  .chip .k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
  .chip .v{font-size:13px;font-weight:500;margin-top:1px}
  .chip.live .k::after{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-left:5px;box-shadow:0 0 8px var(--accent)}
  /* breadcrumb */
  .crumb{display:flex;align-items:center;gap:8px;padding:6px 0 0;color:var(--muted);font-size:13px}
  .crumb button{background:none;border:none;color:var(--accent);cursor:pointer;font-family:inherit;font-size:13px;display:flex;align-items:center;gap:5px}
  .crumb button:hover{text-decoration:underline}
  /* landing */
  .hero{text-align:center;padding:34px 0 22px}
  .hero h1{font-family:"Sora";font-weight:600;font-size:25px;letter-spacing:-.01em}
  .hero p{color:var(--muted);font-size:13.5px;margin-top:7px}
  .cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;padding:6px 0 40px}
  @media(max-width:680px){.cards{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--border);border-radius:16px;padding:22px;cursor:pointer;transition:.18s;position:relative;overflow:hidden}
  .card:hover{border-color:var(--border2);transform:translateY(-2px);box-shadow:0 18px 40px -24px rgba(0,0,0,.7)}
  .card .ic{width:38px;height:38px;border-radius:10px;background:var(--dim);display:flex;align-items:center;justify-content:center;font-size:19px;margin-bottom:14px}
  .card h3{font-family:"Sora";font-weight:600;font-size:16px}
  .card .d{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.4}
  .card .faro{margin-top:16px;font-family:"IBM Plex Mono";font-size:21px;font-weight:600}
  .card .faro small{display:block;font-family:"IBM Plex Sans";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:400;margin-bottom:3px}
  .card::after{content:"→";position:absolute;top:20px;right:20px;color:var(--faint);transition:.18s}
  .card:hover::after{color:var(--accent);transform:translateX(3px)}
  /* module */
  .screen{display:none}
  .screen.on{display:block;animation:rise .35s cubic-bezier(.2,.7,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mhead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
  .mhead h2{font-family:"Sora";font-weight:600;font-size:21px}
  .mhead .sub{color:var(--muted);font-size:12.5px;margin-top:3px;max-width:64ch;line-height:1.5}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:3px}
  .seg button{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12.5px;padding:6px 14px;border-radius:6px;cursor:pointer;transition:.14s}
  .seg button.on{background:var(--raise);color:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:14px 15px;position:relative;overflow:hidden}
  .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.7}
  .kpi.b::after{background:var(--accent2)}.kpi.g::after{background:var(--rec)}.kpi.r::after{background:var(--neg)}.kpi.w::after{background:var(--warn)}
  .kpi .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kpi .v{font-family:"Sora";font-size:20px;font-weight:600;margin-top:7px}
  .kpi .v.num{font-family:"IBM Plex Mono"}
  .kpi .m{font-size:10.5px;color:var(--faint);margin-top:3px}
  .panel{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:18px}
  .panel h3{font-family:"Sora";font-weight:500;font-size:14px;margin-bottom:13px;display:flex;align-items:center;gap:8px}
  .panel h3 .tag{margin-left:auto;font-family:"IBM Plex Mono";font-size:10px;color:var(--muted);background:var(--panel2);border:1px solid var(--border);padding:2px 8px;border-radius:20px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{text-align:right;padding:7px 9px;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:1px solid var(--border2)}
  tbody tr:hover{background:rgba(91,141,239,.05)}
  tr.tot td{border-top:1px solid var(--border2);border-bottom:none;font-weight:600;background:rgba(63,224,197,.05)}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
  .dot.rec{background:var(--rec)}.dot.spo{background:var(--spo)}
  .pos{color:var(--rec)}.neg{color:var(--neg)}.mut{color:var(--muted)}
  input,select{font-family:inherit;font-size:12.5px;color:var(--text);background:var(--panel2);border:1px solid var(--border2);border-radius:7px;padding:7px 9px}
  input.num{font-family:"IBM Plex Mono";text-align:right}
  input:focus,select:focus{outline:none;border-color:var(--accent)}
  .clientrow{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:.14s;background:var(--panel2)}
  .clientrow:hover{border-color:var(--border2);background:var(--raise)}
  .clientrow .nm{flex:1;font-weight:500}
  .badge{font-size:10px;padding:2px 8px;border-radius:20px;font-family:"IBM Plex Mono"}
  .badge.rec{background:rgba(55,211,154,.13);color:var(--rec)}
  .badge.spo{background:rgba(91,141,239,.13);color:var(--spo)}
  .legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-top:9px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px}
  .note{font-size:11px;color:var(--faint);line-height:1.5;margin-top:8px}
  .pend{color:var(--warn);font-family:"IBM Plex Mono"}
  .tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .tools label{font-size:11px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
  .mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:16px}
  .mini-card{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:12px}
  .mini-card .k{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .mini-card .v{font-family:"IBM Plex Mono";font-size:17px;margin-top:6px}
  /* chatbot */
  .chatbar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(transparent,var(--bg) 36%);padding:18px 24px 16px;z-index:30}
  .chatbox{max-width:1080px;margin:0 auto;display:flex;gap:9px;align-items:center;background:var(--panel);border:1px solid var(--border2);border-radius:12px;padding:7px 7px 7px 15px;box-shadow:0 14px 40px -22px #000}
  .chatbox input{flex:1;border:none;background:none;padding:8px 0;font-size:13.5px}
  .chatbox input:focus{outline:none}
  .chatbox button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#06121A;font-weight:600;border-radius:8px;padding:9px 16px;cursor:pointer;font-family:inherit;font-size:13px}
  .answer{max-width:1080px;margin:10px auto 0;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:13px 15px;font-size:13px;line-height:1.55;display:none}
  .answer.on{display:block}
  .answer .q{color:var(--faint);font-size:11.5px;margin-bottom:5px}
  .answer .src{color:var(--faint);font-size:10.5px;margin-top:7px;font-style:italic}
  .pad{height:90px}
  svg text{font-family:"IBM Plex Mono"}
</style>
</head>

  if(SOCIOS_REALES.includes(rm)) return [{rm,w:1}];
  return [];
}
function blankSocio(rm){return{rm,ing:0,co:0,margen:0,contrib:0,fee:0,repartir:0,total:0,ret:0,saldo:0};}
function addAllocated(acc,row,w){
  ['ing','co','margen','contrib','fee','repartir','total'].forEach(k=>acc[k]+=(row[k]||0)*w);
}
function allocatedSocioRows(ms){
  const R=contribution(ms), acc=Object.fromEntries(SOCIOS_REALES.map(rm=>[rm,blankSocio(rm)]));
  R.socio.forEach(row=>splitOwners(row.rm).forEach(o=>addAllocated(acc[o.rm],row,o.w)));
  return SOCIOS_REALES.map(rm=>{const r=acc[rm];r.ret=retiroSocioPeriod(rm,ms);r.saldo=r.total-r.ret;return r;});
}
function allocatedProjectionRows(){
  const raw=projectedContributionBySocio(), acc=Object.fromEntries(SOCIOS_REALES.map(rm=>[rm,blankSocio(rm)]));
  raw.forEach(row=>splitOwners(row.rm).forEach(o=>addAllocated(acc[o.rm],row,o.w)));
  return SOCIOS_REALES.map(rm=>acc[rm]);
}
function allocatedRowsForMonth(m){
  if(DATA.months.includes(m)) return allocatedSocioRows([m]);

}

function monthOfDate(fecha){return fecha.slice(0,7);}
function fmtDate(fecha){
  const [y,m,d]=fecha.split('-');
  return `${d}-${m}-${y}`;
}
function retiroEventsFor(rm){return RETIROS_REALES.filter(r=>r.socio===rm).sort((a,b)=>a.fecha.localeCompare(b.fecha));}
function lastRetiroFor(rm, uptoMonth){
  const ev=retiroEventsFor(rm).filter(r=>monthOfDate(r.fecha)<=uptoMonth);
  return ev.length?ev[ev.length-1]:null;
}
function anticipoMensual(rm,m){
  if(rm!=='RCM') return 0;
  return DATA.months.includes(m) ? cAndAAdvanceM(m) : cAndARunRate();
}
function monthlyBalanceRows(rm, baseRows){
  let acc={ing:0,contrib:0,fee:0,repartir:0,total:0,anticipos:0,saldo:0};
  let last=null;
  const events=retiroEventsFor(rm);
  return baseRows.map(r=>{
    const ev=events.filter(e=>monthOfDate(e.fecha)===r.m);
    const retiro=ev.reduce((a,e)=>a+e.monto,0);
    if(ev.length){
      last=ev[ev.length-1];
      acc={ing:0,contrib:0,fee:0,repartir:0,total:0,anticipos:0,saldo:0};
    }else{
      const ant=anticipoMensual(rm,r.m);
      acc.ing += r.ing||0;
      acc.contrib += r.contrib||0;
      acc.fee += r.fee||0;
      acc.repartir += r.repartir||0;
      acc.total += r.dev||0;
      acc.anticipos += ant;
      acc.saldo += (r.dev||0)-ant;
    }
    return {...r,retiro,anticipo:ev.length?0:anticipoMensual(rm,r.m),acum:acc.saldo,acc:{...acc},lastRetiro:last};
  });
}
function balanceTimelineForSocio(rm){
  const realBase=DATA.months.map(m=>{const x=allocatedSocioRows([m]).find(z=>z.rm===rm)||blankSocio(rm);return{m,ing:x.ing,contrib:x.contrib,fee:x.fee,repartir:x.repartir,dev:x.total};});
  const real=monthlyBalanceRows(rm,realBase).filter(r=>r.ing||r.dev||r.retiro);
  const last=real.length?real[real.length-1]:{acum:0,lastRetiro:null};
  const proj=allocatedProjectionRows().find(x=>x.rm===rm)||blankSocio(rm);
  let acc=last.acc||{ing:0,contrib:0,fee:0,repartir:0,total:0,anticipos:0,saldo:last.acum||0};
  const fut=futureMonths().map(m=>{
    const ant=anticipoMensual(rm,m);
    acc={ing:acc.ing+proj.ing,contrib:acc.contrib+proj.contrib,fee:acc.fee+proj.fee,repartir:acc.repartir+proj.repartir,total:acc.total+proj.total,anticipos:acc.anticipos+ant,saldo:acc.saldo+proj.total-ant};
    return{m,proj:true,ing:proj.ing,contrib:proj.contrib,fee:proj.fee,repartir:proj.repartir,dev:proj.total,retiro:0,anticipo:ant,acum:acc.saldo,acc:{...acc},lastRetiro:last.lastRetiro};
  });
  return real.concat(fut);
}

function flowChart(real,proj){
  const all=real.concat(proj),W=640,H=220,pad={l:54,r:14,t:14,b:26},iw=W-pad.l-pad.r,ih=H-pad.t-pad.b;
  const maxV=Math.max(...all.map(r=>Math.max(r.inc,r.egr)),1),bw=iw/all.length,bar=bw*.26;
  const yV=v=>pad.t+ih-(v/maxV)*ih;
  let s='';for(let t=0;t<=1;t+=.5){const y=pad.t+ih-t*ih;s+=`<line x1="${pad.l}" y1="${y}" x2="${W-pad.r}" y2="${y}" stroke="var(--grid)"/><text x="${pad.l-7}" y="${y+3}" text-anchor="end" font-size="9" fill="var(--faint)">${MM(maxV*t)}</text>`;}
  const divX=pad.l+real.length*bw;
  s+=`<line x1="${divX}" y1="${pad.t}" x2="${divX}" y2="${pad.t+ih}" stroke="var(--warn)" stroke-dasharray="3 3" opacity=".6"/><text x="${divX+3}" y="${pad.t+9}" font-size="8" fill="var(--warn)">proy.</text>`;
  all.forEach((r,i)=>{const cx=pad.l+i*bw+bw/2,proj=i>=real.length,op=proj?.5:.95;
    s+=`<rect x="${cx-bar-1.5}" y="${yV(r.inc)}" width="${bar}" height="${pad.t+ih-yV(r.inc)}" rx="2" fill="var(--accent)" opacity="${op}"/>`;
    s+=`<rect x="${cx+1.5}" y="${yV(r.egr)}" width="${bar}" height="${pad.t+ih-yV(r.egr)}" rx="2" fill="var(--neg)" opacity="${op*.8}"/>`;
    if(i%2===0||all.length<14)s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="8" fill="var(--muted)">${r.label}</text>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">${s}</svg>`;
}
function spark(c){const ms=lastN(12),v=ms.map(m=>incM(c,m)),mx=Math.max(...v,1),W=92,H=24,bw=W/ms.length;
  let s='';v.forEach((x,i)=>{const h=Math.max(x/mx*(H-3),x>0?2:0);s+=`<rect x="${i*bw+1}" y="${H-h}" width="${bw-2}" height="${h}" rx="1" fill="${isRec(c)?'var(--rec)':'var(--spo)'}" opacity="${x>0?.85:.15}"/>`;});
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${s}</svg>`;}

const TITLES={flujo:'Flujo de Caja',clientes:'Clientes',socios:'Socios',control:'Control de Gestión'};
function routeParts(){
  const raw=(window.location.hash||'#home').slice(1);
  const [whereRaw, detailRaw='']=raw.split('/');
  const where=['home','flujo','clientes','socios','control'].includes(whereRaw)?whereRaw:'home';
  let detail=null;
  if(detailRaw){
    try{detail=decodeURIComponent(detailRaw);}catch(e){detail=detailRaw;}
  }
  return {where,detail};
}
function routeHash(where,detail){
  return detail?`${where}/${encodeURIComponent(detail)}`:where;
}
function setRoute(where,detail){
  const next=routeHash(where,detail);
  if((window.location.hash||'').slice(1)===next){applyRoute();return;}
  window.location.hash=next;
}
function go(where){setRoute(where);}
function applyRoute(){
  const {where,detail}=routeParts();
  state.openClient=where==='clientes'?detail:null;
  state.openSocio=where==='socios'?detail:null;
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('s-'+where).classList.add('on');
  document.getElementById('crumb').innerHTML = where==='home' ? '' :
    `<button onclick="go('home')">← Inicio</button><span>/ ${TITLES[where]}</span>`;
  hideAnswer();
  render[where]();
  window.scrollTo(0,0);
}

function projection(){
  const fut=futureMonths(), eg=projExpenseMonthly();
  const recM=clients().filter(isRec).reduce((a,c)=>a+projMonthlyClient(c),0);
  const spoM=clients().filter(c=>!isRec(c)).reduce((a,c)=>a+projMonthlyClient(c),0);
  const inc=recM+spoM, net=inc-eg;
  let caja=state.cajaInicial; const rows=fut.map(m=>{caja+=net;return{label:monLabel(m),inc,egr:eg,net,caja};});
  return{fut,recM,spoM,incMonthly:inc,expMonthly:eg,net,rows,cajaFin:rows.length?rows[rows.length-1].caja:caja};
}

      ${state.sociosView==='mes'?monthSelectHtml('socios-month'):
      `<label>Período</label><div class="seg" id="seg-socios-period">${['mes','semestre','año'].map(v=>`<button class="${state.view===v?'on':''}" data-v="${v}">${v[0].toUpperCase()+v.slice(1)}</button>`).join('')}</div>`}

    <div class="mini-grid">
      ${rows.map(r=>`<div class="mini-card" onclick="openSocio('${r.rm}')" style="cursor:pointer">
        <div class="k">${r.rm}</div><div class="v ${currentBalances[r.rm].acum<0?'neg':'pos'}">${MM(currentBalances[r.rm].acum)}</div>
        <div class="note">Acumulado actual desde último retiro${currentBalances[r.rm].lastRetiro?` · ${fmtDate(currentBalances[r.rm].lastRetiro.fecha)}`:''}</div>

    <p class="note">Selecciona un socio para ver su situación mensual, proyección y detalle. RCM-REP se divide en partes iguales entre RCM y REP; SIN RM queda fuera de Socios.</p>`;
  document.querySelectorAll('#seg-socios button').forEach(b=>b.onclick=()=>{state.sociosView=b.dataset.v;render.socios();});

};

  const P=projection(), l12=lastN(12);
  const recInc=clients().filter(isRec).reduce((a,c)=>a+sumInc(c,l12),0), allInc=clients().reduce((a,c)=>a+sumInc(c,l12),0);
  const byc=clients().map(c=>({c,v:sumInc(c,l12)})).sort((a,b)=>b.v-a.v);
  const top3=byc.slice(0,3).reduce((a,x)=>a+x.v,0);
  const R=contribution(DATA.months);
  const alerta = P.net<0 || (P.recM < P.expMonthly);
  document.getElementById('s-control').innerHTML=`
    <div class="mhead"><div><h2>Control de Gestión</h2><div class="sub">Síntesis visual de lo que más importa.</div></div></div>
    <div class="tools">${monthSelectHtml('control-month')}</div>
    <div class="kpis">
      <div class="kpi ${P.cajaFin<0?'r':'b'}"><div class="k">Caja proyectada dic</div><div class="v num">${MM(P.cajaFin)}</div></div>
      <div class="kpi g"><div class="k">Base recurrente</div><div class="v num">${PCT(allInc?recInc/allInc:0)}</div><div class="m">de los ingresos 12m</div></div>
      <div class="kpi w"><div class="k">Concentración top-3</div><div class="v num">${PCT(allInc?top3/allInc:0)}</div><div class="m">${byc.slice(0,3).map(x=>x.c.split(' ')[0]).join(', ')}</div></div>
      <div class="kpi b"><div class="k">Factor gastos oficina</div><div class="v num">${PCT(R.factor)}</div></div>
    </div>
    <div class="panel"><h3>Ingresos 12m por cliente</h3>
      <div class="legend" style="margin:0 0 10px"><span><i class="dot rec"></i>Recurrente</span><span><i class="dot spo"></i>Esporádico</span></div>
      ${byc.filter(x=>x.v>0).slice(0,10).map(x=>{const w=x.v/byc[0].v*100;return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><span style="width:150px;font-size:12px" class="${isRec(x.c)?'':''}">${x.c}</span><div style="flex:1;height:9px;background:var(--panel2);border-radius:5px;overflow:hidden"><div style="width:${w}%;height:100%;background:${isRec(x.c)?'var(--rec)':'var(--spo)'};opacity:.8"></div></div><span class="num mut" style="width:80px;text-align:right;font-size:11px">${MM(x.v)}</span></div>`;}).join('')}
    </div>
    ${alerta?`<div class="panel" style="border-color:rgba(242,194,97,.35)"><h3 style="color:var(--warn)">⚠ Alerta de gestión</h3><p class="note" style="color:#E7CE96">El flujo operacional recurrente no cubre con holgura el gasto de oficina fijo (${MM(P.recM)}/mes recurrente vs ${MM(P.expMonthly)}/mes de egreso). El excedente a repartir depende de ingresos esporádicos.</p></div>`:''}`;
  bindMonthSelects();
};

/* ===== CHATBOT (motor financiero local + backend seguro en producción) ===== */
function findClient(txt){const t=txt.toUpperCase();return clients().find(c=>t.includes(c.toUpperCase().split(' ')[0])&&c.split(' ')[0].length>2)||clients().find(c=>t.includes(c.toUpperCase()));}
function localAnswer(q){
  const t=q.toLowerCase();
  const socio=SOCIOS.find(s=>t.toUpperCase().includes(s));
  const monthNames=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const mFecha=t.match(/(?:a |hasta |en )?(?:julio|agosto|septiembre|octubre|noviembre|diciembre|enero|febrero|marzo|abril|mayo|junio)\s*(?:de\s*)?20\d\d/);
  let upto=DATA.months[DATA.months.length-1];
  if(mFecha){const mm=monthNames.findIndex(n=>mFecha[0].includes(n));const yy=mFecha[0].match(/20\d\d/)[0];upto=`${yy}-${String(mm+1).padStart(2,'0')}`;}
  // ingresos cliente últimos N meses
  const mMonths=t.match(/(\d+)\s*mes/);
  if(/(ingres|factur|cobr|cuánto.*(entr|ingres))/.test(t)){
    const c=findClient(q); if(c){const n=mMonths?+mMonths[1]:12;const v=sumInc(c,lastN(n));
      return{a:`${c} registra <b>${CLP(v)}</b> cobrados en los últimos ${n} meses.`,src:'motor financiero · cartola'};}
  }
  // reparto a fecha
  if(/repart|retir.*socio|cuánto.*retir/.test(t)){
    if(socio && SOCIOS_REALES.includes(socio) && mFecha){
      const b=balanceTimelineForSocio(socio).find(r=>r.m===upto);
      if(b){
        const acc=b.acc||{total:0,anticipos:0};
        const last=b.lastRetiro?` Último retiro/corte: <b>${CLP(b.lastRetiro.monto)}</b> el ${fmtDate(b.lastRetiro.fecha)}.`:' Sin retiro/corte registrado.';
        return{a:`${socio} en ${monLabel(upto)}: saldo acumulado desde último retiro/corte <b>${CLP(b.acum)}</b>. Devengado del mes: <b>${CLP(b.dev)}</b>. Anticipo del mes: <b>${CLP(b.anticipo)}</b>${socio==='RCM'?' por C&A Acciona + Hidro Maule':''}. Acumulado devengado: <b>${CLP(acc.total)}</b>; anticipos acumulados: <b>${CLP(acc.anticipos)}</b>.${last}`,src:'motor financiero · socios acumulado'};
      }
    }
    const ms=DATA.months.filter(m=>m<=upto); const R=contribution(ms);
    const lines=R.socio.filter(s=>s.total!==0).map(s=>{const ret=retiroSocioPeriod(s.rm,ms);return`${s.rm}: devengado <b>${CLP(s.total)}</b>, anticipo <b>${CLP(ret)}</b>, saldo <b>${CLP(s.total-ret)}</b>`;}).join(' · ');
    return{a:`Distribuible acumulado hasta ${monLabel(upto)}: ${lines}. Solo RCM descuenta C&A como anticipo; no se imputan retiros mensuales a REP/CTC.`,src:'motor financiero · cascada de contribución'};
  }
  // saldo socio
  if(/saldo/.test(t)){const rm=SOCIOS_REALES.find(s=>t.toUpperCase().includes(s));if(rm){const rows=balanceTimelineForSocio(rm);const b=rows[rows.length-1];return{a:`Saldo acumulado de ${rm} al último mes disponible/proyectado: <b>${CLP(b?b.acum:0)}</b>.`,src:'motor financiero · socios acumulado'};}}
  return null;
}
async function ask(){
  const q=document.getElementById('q').value.trim(); if(!q)return;
  const ans=document.getElementById('answer'); ans.classList.add('on');
  const local=localAnswer(q);
  if(local){ ans.innerHTML=`<div class="q">${q}</div>${local.a}<div class="src">${local.src}</div>`; return; }
  if(BACKEND){
    ans.innerHTML=`<div class="q">${q}</div><span class="mut">Consultando…</span>`;
    try{const r=await fetch(BACKEND+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});
      const d=await r.json(); ans.innerHTML=`<div class="q">${q}</div>${d.answer}<div class="src">IA financiera · funciones verificadas</div>`;
    }catch(e){ans.innerHTML=`<div class="q">${q}</div><span class="mut">No fue posible conectar con la IA financiera.</span>`;}
  } else {
    ans.innerHTML=`<div class="q">${q}</div>Esta consulta se procesará con la <b>IA financiera</b> cuando el backend esté conectado. El motor financiero resuelve consultas sobre ingresos por cliente, reparto a una fecha y saldos por socio.<div class="src">motor financiero · sin backend en esta vista de prueba</div>`;
  }
}
